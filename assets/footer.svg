<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">Let's build something meaningful</title>
  <desc id="desc">A polished animated footer in purple, blue, and red.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090615"/>
      <stop offset=".55" stop-color="#070b1b"/>
      <stop offset="1" stop-color="#120609"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="210" rx="20" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="207" rx="19" fill="none" stroke="url(#neon)" stroke-width="3"/>
  <circle cx="115" cy="105" r="70" fill="#8b5cf6" opacity=".06">
    <animate attributeName="r" values="58;78;58" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1085" cy="105" r="70" fill="#ef4444" opacity=".06">
    <animate attributeName="r" values="78;58;78" dur="5s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="64" fill="#a78bfa" font-family="Consolas, monospace" font-size="13" letter-spacing="5">CONNECTION REQUEST</text>
    <text x="600" y="111" fill="#f8fafc" font-size="31" font-weight="750" letter-spacing="2">LET'S BUILD SOMETHING MEANINGFUL</text>
    <text x="600" y="145" fill="#94a3b8" font-size="16">Open to collaboration, shared learning, and thoughtful engineering challenges.</text>
  </g>

  <path d="M310 174H520" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
  <path d="M680 174H890" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <circle cx="600" cy="174" r="5" fill="#3b82f6" filter="url(#glow)">
    <animate attributeName="opacity" values=".35;1;.35" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="181" text-anchor="middle" fill="#60a5fa" font-family="Consolas, monospace" font-size="13">@SujalShrestha-sys</text>
</svg>
